[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "kleinanzeigen-mcp"
version = "0.1.0"
description = "Unofficial Kleinanzeigen MCP server"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.13,<3.14"
dependencies = [
  "fastmcp==4.1.0",
  "mcp==2.3.0",
  "kleinanzeigen-api==0.4.0",
  "httpx==0.28.1",
  "pydantic>=2.12,<3",
  "curl-cffi>=0.13,<1",
]

[project.scripts]
kleinanzeigen-mcp = "kleinanzeigen_mcp.server:main"

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "pytest-socket>=0.7,<1", "ruff>=0.13,<1", "mypy>=1.18,<2"]

[tool.hatch.build.targets.wheel]
packages = ["src/kleinanzeigen_mcp"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/server.py", "/smoke_test.py", "/pyproject.toml", "/uv.lock", "/README.md", "/LICENSE", "/docs/DESIGN.md", "/docs/OPERATIONS.md", "/docs/validation-2026-10-16.md"]

[tool.ruff]
target-version = "py313"
line-length = 100
exclude = [".refs", ".venv", "docs/DESIGN.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.13"
strict = true

[[tool.mypy.overrides]]
module = ["kleinanzeigen_api", "kleinanzeigen_api.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "--disable-socket --allow-unix-socket"
testpaths = ["tests"]
